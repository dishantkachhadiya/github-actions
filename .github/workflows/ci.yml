name: Python CI 
on: [push]

jobs: 
  test: 
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest test_calculator.py
        
